name: Build releases

on:
  push:
    tags: ['v*', 'beta-*']   # e.g. beta-release3, v1.0.0
  workflow_dispatch:     # manual run from the Actions tab

permissions:
  contents: write        # needed to attach files to a GitHub Release

# Flutter is pinned: channel "stable" alone took Flutter 3.50.0 on
# 2026-11-11 and its Windows builds crash inside the NVIDIA driver
# (nvwgf2umx.dll) on some PCs; 3.47.9 builds did not. Change it on purpose
# and test Windows before shipping.
env:
  FLUTTER_VERSION: '3.47.9'
  # Версия лаунчера — тег релиза (по нему лаунчер узнаёт, вышла ли новая);
  # у сборки не по тегу — пусто.
  BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  # Static analysis and unit tests. Not required by the release job,
  # so a lint problem never blocks publishing the binaries.
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Библиотеки игры для тестов плеера (модули, музыка приставок).
      - name: Install player test libraries
        timeout-minutes: 20
        run: bash .github/scripts/apt-install.sh libgme0 libopenmpt0
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  linux-appimage:
    runs-on: ubuntu-22.04   # old enough glibc, so the AppImage runs on most distros
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # libgme0 / libopenmpt0 — не для сборки, а для AppImage: ими плеер
      # играет модули и музыку приставок.
      - name: Install Linux build dependencies
        timeout-minutes: 25
        run: >
          bash .github/scripts/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          libasound2-dev libgme0 libopenmpt0

      - run: flutter pub get
      # Страна хоста на вкладке «Серверы»: база DB-IP Lite (CC BY 4.0) — в сборку.
      - name: Build GeoIP database
        continue-on-error: true
        run: python3 tools/build_geoip.py assets/geoip/country.bin
      # flutter_soloud: звук через ALSA (libasound2-dev выше), без системных
      # libopus/libogg (их нет в AppImage).
      # Дата и коммит сборки — в настройках лаунчера (последняя ли версия).
      - run: >
          flutter build linux --release
          --dart-define=BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          --dart-define=BUILD_COMMIT="${GITHUB_SHA::7}"
          --dart-define=BUILD_FLUTTER="$FLUTTER_VERSION"
          --dart-define=BUILD_VERSION="$BUILD_VERSION"
        env:
          NO_OPUS_OGG_LIBS: '1'

      # antd downloads are kept between runs: if neither GitHub nor the
      # GitLab mirror gives the ant-sdk release, the cached copy goes in.
      - uses: actions/cache@v4
        with:
          path: .antd-cache
          key: antd-${{ runner.os }}-${{ hashFiles('lib/services/antd_daemon.dart') }}
          restore-keys: antd-${{ runner.os }}-

      - name: Build AppImage
        run: |
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"

          # Bundle libepoxy (not present on every system; Flutter needs it)
          EPOXY="$(ldd build/linux/x64/release/bundle/lib/libflutter_linux_gtk.so | awk '/libepoxy/ {print $3}' | head -1)"
          if [ -z "$EPOXY" ]; then EPOXY="$(ldconfig -p | awk '/libepoxy\.so\.0/ {print $NF}' | head -1)"; fi
          echo "Bundling libepoxy from: $EPOXY"
          mkdir -p "$APPDIR/usr/bin/lib"
          cp -L "$EPOXY" "$APPDIR/usr/bin/lib/"

          # Music libraries the game also uses: libopenmpt (MOD/XM/IT/S3M) and
          # libgme (SPC, VGM...), with the codecs libopenmpt depends on.
          for lib in libgme.so.0 libopenmpt.so.0 libmpg123.so.0 libogg.so.0 libvorbis.so.0 libvorbisfile.so.3; do
            path="$(ldconfig -p | awk -v l="$lib" '$1 == l && /x86-64/ {print $NF}' | head -1)"
            if [ -n "$path" ]; then cp -L "$path" "$APPDIR/usr/bin/lib/"; echo "Bundled $path"; else echo "Not found: $lib"; fi
            # Its license goes with it, in lib/licenses (libgme is LGPL).
            pkg="$(dpkg -S "$(readlink -f "$path" 2>/dev/null || echo "$path")" 2>/dev/null | head -1 | cut -d: -f1)"
            if [ -n "$path" ] && [ -n "$pkg" ] && [ -f "/usr/share/doc/$pkg/copyright" ]; then
              mkdir -p "$APPDIR/usr/bin/lib/licenses"
              cp "/usr/share/doc/$pkg/copyright" "$APPDIR/usr/bin/lib/licenses/$pkg.copyright"
            fi
          done

          # antd (the Autonomi daemon) inside the AppImage: users do not have to
          # download it from GitHub on the first start.
          ANTD_CACHE=.antd-cache bash packaging/fetch_antd.sh antd-linux-amd64 "$APPDIR/usr/bin/antd" antd

          cp packaging/linux/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"
          cp packaging/linux/srb2al.desktop "$APPDIR/"
          cp packaging/linux/srb2al.png "$APPDIR/srb2al.png"
          # The repository the launcher offers to connect on the first start.
          cp packaging/pointer.txt "$APPDIR/usr/bin/pointer.txt"
          # Attribution of the data in the launcher (DB-IP, flags).
          cp packaging/NOTICE.txt "$APPDIR/usr/bin/NOTICE.txt"
          # Custom games (BlanKart) offered on the first start.
          cp packaging/another_games.json "$APPDIR/usr/bin/another_games.json"

          # Downloads from GitHub sometimes break off: retry, and show the error.
          curl -fSL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 --max-time 300 \
            -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run "$APPDIR" SRB2-Autonomi-Launcher-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: SRB2-Autonomi-Launcher-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - name: Build GeoIP database
        continue-on-error: true
        run: python tools/build_geoip.py assets/geoip/country.bin
      - run: >
          flutter build windows --release
          --dart-define=BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          --dart-define=BUILD_COMMIT="${GITHUB_SHA::7}"
          --dart-define=BUILD_FLUTTER="$FLUTTER_VERSION"
          --dart-define=BUILD_VERSION="$BUILD_VERSION"
        shell: bash

      # Плеер играет трекерные модули и музыку приставок библиотеками
      # libopenmpt и libgme (как сама игра). Кладём их (с зависимостями) в
      # папку lib рядом с лаунчером. Не получилось — лаунчер ищет их ещё и в
      # папке игры, поэтому сборку не роняем.
      - uses: msys2/setup-msys2@v2
        id: msys2
        continue-on-error: true
        with:
          msystem: MINGW64
          release: false

      - name: Bundle music libraries
        if: steps.msys2.outcome == 'success'
        continue-on-error: true
        shell: msys2 {0}
        run: bash packaging/bundle_music_windows.sh

      # Flutter apps need the MSVC runtime, which is missing on a clean Windows
      # ("MSVCP140.dll was not found"). Ship it next to the .exe (app-local deployment).
      - name: Bundle Visual C++ runtime
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR\System32\$dll" -Destination $dest -ErrorAction Stop
          }

      # antd downloads are kept between runs: if neither GitHub nor the
      # GitLab mirror gives the ant-sdk release, the cached copy goes in.
      - uses: actions/cache@v4
        with:
          path: .antd-cache
          key: antd-${{ runner.os }}-${{ hashFiles('lib/services/antd_daemon.dart') }}
          restore-keys: antd-${{ runner.os }}-

      # antd (the Autonomi daemon) next to the launcher: users do not have to
      # download it from GitHub on the first start.
      - name: Bundle antd
        shell: bash
        env:
          ANTD_CACHE: .antd-cache
        run: bash packaging/fetch_antd.sh antd-windows-amd64.exe build/windows/x64/runner/Release/antd antd.exe

      # The repository the launcher offers to connect on the first start.
      - name: Add pointer.txt, NOTICE.txt and another_games.json
        run: |
          Copy-Item packaging\pointer.txt build\windows\x64\runner\Release\pointer.txt
          # Attribution of the data in the launcher (DB-IP, flags).
          Copy-Item packaging\NOTICE.txt build\windows\x64\runner\Release\NOTICE.txt
          # Custom games (BlanKart) offered on the first start.
          Copy-Item packaging\another_games.json build\windows\x64\runner\Release\another_games.json

      - name: Zip build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SRB2-Autonomi-Launcher-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: SRB2-Autonomi-Launcher-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*